<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="sleeveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Full Sleeves with Barrel Cuffs -->
  <g filter="url(#sleeveShadow)">
    <path d="M110 180 L40 450 L100 450 L140 240 Z" fill="url(#sleeveGrad)" />
    <path d="M390 180 L460 450 L400 450 L360 240 Z" fill="url(#sleeveGrad)" />
    <!-- Cuffs -->
    <rect x="35" y="445" width="68" height="25" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <rect x="397" y="445" width="68" height="25" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <circle cx="70" cy="457" r="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5" />
    <circle cx="430" cy="457" r="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5" />
  </g>
</svg>
