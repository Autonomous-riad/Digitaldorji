<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="frenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="frenchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Full Sleeves with French Double Cuffs & Gold Links -->
  <g filter="url(#frenchShadow)">
    <path d="M110 180 L40 450 L100 450 L140 240 Z" fill="url(#frenchGrad)" />
    <path d="M390 180 L460 450 L400 450 L360 240 Z" fill="url(#frenchGrad)" />
    <!-- Double French Cuffs -->
    <rect x="30" y="440" width="75" height="32" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="395" y="440" width="75" height="32" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <!-- Gold Cufflinks -->
    <circle cx="68" cy="456" r="5" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
    <circle cx="432" cy="456" r="5" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
  </g>
</svg>
