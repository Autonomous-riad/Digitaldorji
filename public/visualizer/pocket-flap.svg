<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="flapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Jetted Pocket with Flap Cover & Button -->
  <g filter="url(#flapShadow)" transform="translate(295, 230)">
    <path d="M0 0 L80 0 L80 26 L40 40 L0 26 Z" fill="url(#flapGrad)" stroke="#CBD5E1" stroke-width="0.8" />
    <circle cx="40" cy="20" r="3.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6" />
  </g>
</svg>
