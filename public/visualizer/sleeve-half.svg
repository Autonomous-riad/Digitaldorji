<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="halfSleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="halfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Crisp Folded Half Sleeves -->
  <g filter="url(#halfShadow)">
    <path d="M110 180 L55 300 L115 310 L140 220 Z" fill="url(#halfSleeveGrad)" />
    <path d="M390 180 L445 300 L385 310 L360 220 Z" fill="url(#halfSleeveGrad)" />
    <!-- Folded Hem -->
    <rect x="52" y="295" width="65" height="16" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <rect x="383" y="295" width="65" height="16" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
  </g>
</svg>
