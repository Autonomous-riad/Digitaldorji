<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <filter id="weltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Bespoke Welt Inset Pocket -->
  <g filter="url(#weltShadow)" transform="translate(300, 240)">
    <rect x="0" y="0" width="75" height="12" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <line x1="0" y1="6" x2="75" y2="6" stroke="#94A3B8" stroke-width="0.8" />
  </g>
</svg>
