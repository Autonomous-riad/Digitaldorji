<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="pocketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Chest Patch Pocket -->
  <g filter="url(#pocketShadow)" transform="translate(300, 220)">
    <path d="M0 0 L70 0 L70 65 L35 85 L0 65 Z" fill="url(#pocketGrad)" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="0" y1="12" x2="70" y2="12" stroke="#CBD5E1" stroke-width="0.6" />
  </g>
</svg>
